<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripPlanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .bg-tentative {
            background-image: repeating-linear-gradient(45deg,rgba(255,255,255,0.4),rgba(255,255,255,0.4) 10px,transparent 10px,transparent 20px);
        }
        .timeline-scroll::-webkit-scrollbar{height:8px}
        .timeline-scroll::-webkit-scrollbar-track{background:#f1f5f9}
        .timeline-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
        #sync-indicator{transition:opacity .5s ease}

        /* ── Logo 上下翻轉（繞 X 軸） ── */
        .logo-flip-wrapper{
            perspective:600px;
            display:inline-flex;
            align-items:center;
            cursor:pointer;
            position:relative;
        }
        .logo-sizer{
            visibility:hidden;
            display:flex;
            align-items:center;
            gap:6px;
            white-space:nowrap;
            font-weight:700;
            font-size:1.125rem;
        }
        @media(min-width:640px){.logo-sizer{font-size:1.25rem}}
        .logo-flip-inner{
            position:absolute;
            inset:0;
            transform-style:preserve-3d;
            transition:transform .55s cubic-bezier(.4,0,.2,1);
            display:flex;
            align-items:center;
        }
        /* ✅ 上下翻轉：繞 X 軸旋轉 180deg */
        .logo-flip-inner.flipped{transform:rotateX(180deg)}
        .logo-face{
            position:absolute;
            inset:0;
            backface-visibility:hidden;
            -webkit-backface-visibility:hidden;
            display:flex;
            align-items:center;
            gap:6px;
            white-space:nowrap;
        }
        .logo-face.front{transform:rotateX(0deg)}
        /* 背面需補償 X 軸翻轉後的上下顛倒 */
        .logo-face.back{transform:rotateX(180deg)}

        /* ── BillSplitter 樣式 ── */
        :root{--bs-primary:#2563eb;--bs-primary-hover:#1d4ed8;--bs-bg:#f8fafc;--bs-card:#ffffff;--bs-text:#0f172a;--bs-border:#e2e8f0;--bs-danger:#ef4444}
        .bs-card{background:var(--bs-card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:24px}
        .bs-section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid var(--bs-border);padding-bottom:12px}
        .bs-section-header h2{font-size:1.1rem;font-weight:700;color:var(--bs-text)}
        .bs-btn{background:var(--bs-primary);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:.9rem;font-weight:500}
        .bs-btn:hover{background:var(--bs-primary-hover)}
        .bs-btn-outline{background:transparent;color:var(--bs-text);border:1px solid var(--bs-border)}
        .bs-btn-outline:hover{background:var(--bs-border)}
        .bs-btn-danger{background:var(--bs-danger)}
        .bs-btn-danger:hover{background:#dc2626}
        .bs-btn-success{background:#16a34a;color:#fff}
        .bs-btn-success:hover{background:#15803d}
        .bs-btn-sm{padding:4px 8px;font-size:.8rem}
        .bs-btn-icon{width:38px;min-width:38px;height:38px;padding:0;display:inline-flex;justify-content:center;align-items:center;font-size:1.15rem;font-weight:700}
        .bs-bill-list{list-style:none}
        .bs-bill-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--bs-border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:background .2s}
        .bs-bill-item:hover{background:#f1f5f9}
        .bs-settlement-item{padding:10px 0;border-bottom:1px dashed var(--bs-border);display:flex;justify-content:space-between}
        .bs-settlement-item:last-child{border-bottom:none}
        .bs-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:200}
        .bs-modal-overlay.active{display:flex}
        .bs-modal{background:#fff;padding:24px;border-radius:12px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
        .bs-modal-header{display:flex;justify-content:space-between;margin-bottom:16px;align-items:center}
        .bs-form-group{margin-bottom:16px}
        .bs-form-group label{display:block;margin-bottom:6px;font-size:.9rem;font-weight:500}
        .bs-form-control{width:100%;padding:8px 12px;border:1px solid var(--bs-border);border-radius:6px;font-size:.9rem}
        .bs-dynamic-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
        .bs-toggle-group{display:flex;background:var(--bs-bg);border-radius:6px;padding:2px;border:1px solid var(--bs-border)}
        .bs-toggle-btn{padding:4px 12px;border:none;background:transparent;font-size:.8rem;cursor:pointer;border-radius:4px}
        .bs-toggle-btn.active{background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1)}
        .bs-member-chip{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#f1f5f9;color:#334155;font-size:.82rem;gap:6px}
        .bs-empty-hint{color:#64748b;font-size:.85rem}

        /* ── 手機底部導覽列 ── */
        #mobile-bottom-nav{display:none}
        @media(max-width:767px){
            #mobile-bottom-nav{display:flex}
            main{padding-bottom:80px!important}
            #desktop-tabs{display:none!important}
            header .max-w-7xl{padding-left:12px!important;padding-right:12px!important}
            #project-select{max-width:110px}
            #sync-text{display:none}
            #activities-table-wrapper table,#activities-table-wrapper thead,
            #activities-table-wrapper tbody,#activities-table-wrapper th,
            #activities-table-wrapper td,#activities-table-wrapper tr{display:block}
            #activities-table-wrapper thead{display:none}
            #activities-table-wrapper tbody tr{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
            #activities-table-wrapper tbody td{padding:4px 0;border:none;font-size:13px;display:flex;align-items:flex-start;gap:6px}
            #activities-table-wrapper tbody td::before{content:attr(data-label);font-weight:600;color:#64748b;min-width:64px;font-size:11px;padding-top:2px;flex-shrink:0}
            #activities-table-wrapper tbody td[data-label=""]{justify-content:flex-end;padding-top:8px;margin-top:4px;border-top:1px solid #f1f5f9}
            #activities-table-wrapper tbody td[data-label=""]::before{display:none}
            #personnel-list-container{grid-template-columns:1fr!important}
            .modal-box{position:fixed!important;bottom:0!important;left:0!important;right:0!important;top:auto!important;border-radius:20px 20px 0 0!important;max-width:100%!important;max-height:92vh;overflow-y:auto;animation:slideUp .25s ease}
            .modal-outer{align-items:flex-end!important}
            @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
            #project-banner{padding:12px!important}
            #current-project-title{font-size:16px!important}
            #timeline-date-filters{gap:6px}
            .bs-modal{border-radius:20px 20px 0 0;max-height:92vh}
            .bs-modal-overlay{align-items:flex-end}
            /* 手機隱藏桌面版新增按鈕 */
            #btn-add-activity-desktop{display:none}
            #btn-add-bill-desktop{display:none}
            /* 手機顯示懸浮按鈕 */
            .mobile-fab{display:flex!important}
        }
        @media(min-width:768px){
            /* 桌面隱藏懸浮按鈕 */
            .mobile-fab{display:none!important}
        }

        /* 懸浮 FAB 按鈕共用樣式 */
        .mobile-fab{
            display:none;
            position:fixed;
            right:20px;
            width:56px;
            height:56px;
            border-radius:50%;
            border:none;
            color:#fff;
            font-size:28px;
            font-weight:300;
            align-items:center;
            justify-content:center;
            box-shadow:0 4px 16px rgba(0,0,0,.25);
            cursor:pointer;
            z-index:39;
            transition:transform .15s, box-shadow .15s;
            line-height:1;
        }
        .mobile-fab:active{transform:scale(.93);box-shadow:0 2px 8px rgba(0,0,0,.2)}
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore,doc,getDoc,setDoc,onSnapshot,serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // ✏️ 請替換為你的 Firebase 設定
        const firebaseConfig = {
          apiKey: "AIzaSyDDqGA_Sh3oUKDw5v0ZfL-OJWSYIEqkAs0",
          authDomain: "trip-planner-by-a01789.firebaseapp.com",
          projectId: "trip-planner-by-a01789",
          storageBucket: "trip-planner-by-a01789.firebasestorage.app",
          messagingSenderId: "123576673845",
          appId: "1:123576673845:web:5a1990fbc831c6c0f0b37c",
          measurementId: "G-GB14NQN8DF"
        };

        const app = initializeApp(firebaseConfig);
        const db  = getFirestore(app);
        window._db=db; window._fsDoc=doc; window._fsGetDoc=getDoc;
        window._fsSetDoc=setDoc; window._fsOnSnapshot=onSnapshot;
        window._fsServerTimestamp=serverTimestamp; window._firebaseReady=true;
        window.dispatchEvent(new Event("firebase-ready"));
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

<!-- ══════════════════════════════════════════
     Header
══════════════════════════════════════════ -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-14 sm:h-16">

            <div class="flex items-center space-x-2 sm:space-x-4 min-w-0">

                <!-- Logo 上下翻轉區 -->
                <div class="logo-flip-wrapper flex-shrink-0" onclick="toggleApp()" title="切換應用程式">
                    <!-- 佔位（取較寬者） -->
                    <div class="logo-sizer">
                        <span>BillSplitter</span>
                    </div>
                    <div class="logo-flip-inner" id="logoFlipInner">
                        <!-- 正面：TripPlanner -->
                        <div class="logo-face front text-indigo-600 font-bold text-lg sm:text-xl">
                            <i data-lucide="map-pin" class="w-5 h-5 sm:w-6 sm:h-6 flex-shrink-0"></i>
                            <span class="hidden sm:inline">TripPlanner</span>
                            <span class="sm:hidden">Trip</span>
                        </div>
                        <!-- 背面：BillSplitter -->
                        <div class="logo-face back text-emerald-600 font-bold text-lg sm:text-xl">
                            <i data-lucide="receipt" class="w-5 h-5 sm:w-6 sm:h-6 flex-shrink-0"></i>
                            <span class="hidden sm:inline">BillSplitter</span>
                            <span class="sm:hidden">Bill</span>
                        </div>
                    </div>
                </div>

                <div class="h-5 w-px bg-slate-300 flex-shrink-0"></div>

                <div class="flex items-center space-x-1 sm:space-x-2 min-w-0">
                    <select id="project-select" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs sm:text-sm font-semibold py-1.5 px-2 sm:px-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 min-w-0 truncate"></select>
                    <button onclick="openNewProjectModal()" class="inline-flex items-center justify-center p-1.5 text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors flex-shrink-0" title="新增專案">
                        <i data-lucide="plus-circle" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                    </button>
                    <button onclick="handleDeleteCurrentProject()" class="inline-flex items-center justify-center p-1.5 text-red-500 hover:bg-red-50 rounded-lg transition-colors flex-shrink-0" title="刪除當前專案">
                        <i data-lucide="trash-2" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center space-x-1 sm:space-x-4 flex-shrink-0">
                <div id="sync-indicator" class="flex items-center space-x-1.5 text-xs text-slate-400">
                    <span id="sync-dot" class="w-2 h-2 rounded-full bg-slate-300 flex-shrink-0"></span>
                    <span id="sync-text" class="hidden sm:inline">連線中...</span>
                </div>
                <nav id="desktop-tabs" class="flex space-x-1 sm:space-x-2">
                    <button onclick="switchTab('timeline')" id="tab-btn-timeline" class="tab-btn flex items-center space-x-1.5 px-3 py-2 rounded-md text-sm font-medium text-indigo-600 bg-indigo-50">
                        <i data-lucide="calendar" class="w-4 h-4"></i><span>時程圖</span>
                    </button>
                    <button onclick="switchTab('activities')" id="tab-btn-activities" class="tab-btn flex items-center space-x-1.5 px-3 py-2 rounded-md text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100">
                        <i data-lucide="list-todo" class="w-4 h-4"></i><span>活動清單</span>
                    </button>
                    <button onclick="switchTab('personnel')" id="tab-btn-personnel" class="tab-btn flex items-center space-x-1.5 px-3 py-2 rounded-md text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100">
                        <i data-lucide="users" class="w-4 h-4"></i><span>人員清單</span>
                    </button>
                </nav>
            </div>
        </div>
    </div>
</header>

<!-- ══════════════════════════════════════════
     TripPlanner Main
══════════════════════════════════════════ -->
<main id="app-trip" class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 lg:p-8">

    <div id="loading-overlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-slate-600 font-medium text-sm sm:text-base">正在連線到雲端資料庫...</p>
    </div>

    <div id="project-banner" class="bg-white p-3 sm:p-4 rounded-xl border border-slate-200 shadow-sm mb-4 sm:mb-6 flex flex-wrap items-center justify-between gap-3">
        <div class="min-w-0">
            <h1 id="current-project-title" class="text-base sm:text-xl font-bold text-slate-900 truncate">載入中...</h1>
            <p id="current-project-dates" class="text-xs sm:text-sm text-slate-500 flex items-center mt-0.5">
                <i data-lucide="calendar-days" class="w-3.5 h-3.5 mr-1 flex-shrink-0"></i><span>-</span>
            </p>
        </div>
        <div id="current-project-members" class="flex items-center -space-x-2 overflow-hidden"></div>
    </div>

    <!-- Tab 1：時程圖 -->
    <section id="tab-timeline" class="tab-content space-y-3 sm:space-y-4">
        <div class="bg-white p-3 sm:p-4 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex items-start sm:items-center justify-between flex-wrap gap-2">
                <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                    <span class="text-xs sm:text-sm font-medium text-slate-700 flex items-center flex-shrink-0">
                        <i data-lucide="filter" class="w-3.5 h-3.5 mr-1 text-slate-500"></i>篩選：
                    </span>
                    <div id="timeline-date-filters" class="flex flex-wrap gap-1.5"></div>
                </div>
                <div class="flex items-center gap-3">
                    <!-- 桌面版新增活動按鈕 -->
                    <button id="btn-add-activity-desktop" onclick="openActivityModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg flex items-center shadow-sm transition-colors">
                        <i data-lucide="plus" class="w-3.5 h-3.5 mr-1"></i>新增活動
                    </button>
                    <div class="text-xs text-slate-500 flex items-center space-x-3 flex-shrink-0">
                        <span class="flex items-center"><span class="w-2.5 h-2.5 rounded bg-indigo-500 inline-block mr-1"></span>確定</span>
                        <span class="flex items-center"><span class="w-2.5 h-2.5 rounded bg-indigo-500 bg-tentative border border-indigo-400 inline-block mr-1"></span>擬訂</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto timeline-scroll">
                <div id="timeline-grid" class="min-w-[600px] sm:min-w-[700px]"></div>
            </div>
        </div>
    </section>

    <!-- Tab 2：活動清單 -->
    <section id="tab-activities" class="tab-content hidden space-y-3 sm:space-y-4">
        <div class="flex justify-between items-center">
            <h2 class="text-base sm:text-lg font-bold text-slate-800">活動資料表</h2>
            <button onclick="openActivityModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium px-3 sm:px-4 py-2 rounded-lg flex items-center shadow-sm transition-colors">
                <i data-lucide="plus" class="w-4 h-4 mr-1"></i>新增活動
            </button>
        </div>
        <div id="activities-table-wrapper" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto sm:overflow-visible">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                        <th class="p-3.5">活動名稱</th><th class="p-3.5">參與人員</th>
                        <th class="p-3.5">開始時間</th><th class="p-3.5">結束時間</th>
                        <th class="p-3.5">集合地點</th><th class="p-3.5">聯絡資料</th>
                        <th class="p-3.5 text-center">擬訂</th><th class="p-3.5 text-center">顏色</th>
                        <th class="p-3.5 text-right">操作</th>
                    </tr>
                </thead>
                <tbody id="activities-table-body" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </section>

    <!-- Tab 3：人員清單 -->
    <section id="tab-personnel" class="tab-content hidden space-y-3 sm:space-y-4">
        <div class="flex justify-between items-center">
            <h2 class="text-base sm:text-lg font-bold text-slate-800">人員成員管理</h2>
            <button onclick="openModal('add-person-modal')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium px-3 sm:px-4 py-2 rounded-lg flex items-center shadow-sm transition-colors">
                <i data-lucide="user-plus" class="w-4 h-4 mr-1"></i>新增成員
            </button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4" id="personnel-list-container"></div>
    </section>
</main>

<!-- ══════════════════════════════════════════
     BillSplitter Main
══════════════════════════════════════════ -->
<main id="app-bill" class="hidden flex-1 w-full mx-auto p-4 sm:p-6" style="max-width:900px">
    <div class="bs-card flex flex-wrap items-center justify-between gap-4 mb-0">
        <div class="min-w-0">
            <span style="font-size:.85rem;color:#64748b">當前專案</span>
            <h1 id="bs-project-title" class="text-lg font-bold text-slate-900 truncate">載入中...</h1>
        </div>
        <div id="bs-project-members" class="flex items-center -space-x-2 overflow-hidden"></div>
    </div>

    <div class="bs-card">
        <div class="bs-section-header">
            <h2>單據紀錄</h2>
            <!-- 桌面版新增單據按鈕 -->
            <button id="btn-add-bill-desktop" class="bs-btn" onclick="bsOpenBillModal()">+ 新增單據</button>
        </div>
        <ul class="bs-bill-list" id="bs-bill-list">
            <li style="text-align:center;color:#64748b;padding:10px">尚無單據資料</li>
        </ul>
    </div>

    <div class="bs-card">
        <div class="bs-section-header">
            <h2>帳務結算</h2>
            <span style="font-size:.82rem;color:#64748b">最少交易數</span>
        </div>
        <div id="bs-settlement-list">
            <div style="text-align:center;color:#64748b">無需交易或無單據</div>
        </div>
    </div>
</main>

<!-- ══════════════════════════════════════════
     手機底部導覽列（TripPlanner）
══════════════════════════════════════════ -->
<nav id="mobile-bottom-nav" class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 shadow-lg items-center justify-around h-16 px-2">
    <button onclick="switchTab('timeline')" id="mob-btn-timeline" class="mob-tab-btn flex flex-col items-center justify-center flex-1 h-full space-y-0.5 text-indigo-600">
        <i data-lucide="calendar" class="w-5 h-5"></i><span class="text-[10px] font-semibold">時程圖</span>
    </button>
    <button onclick="switchTab('activities')" id="mob-btn-activities" class="mob-tab-btn flex flex-col items-center justify-center flex-1 h-full space-y-0.5 text-slate-400">
        <i data-lucide="list-todo" class="w-5 h-5"></i><span class="text-[10px] font-semibold">活動清單</span>
    </button>
    <button onclick="switchTab('personnel')" id="mob-btn-personnel" class="mob-tab-btn flex flex-col items-center justify-center flex-1 h-full space-y-0.5 text-slate-400">
        <i data-lucide="users" class="w-5 h-5"></i><span class="text-[10px] font-semibold">人員清單</span>
    </button>
</nav>

<!-- ══════════════════════════════════════════
     手機懸浮 FAB 按鈕
══════════════════════════════════════════ -->
<!-- TripPlanner 時程圖 FAB（底部導覽列上方） -->
<button id="fab-add-activity"
    class="mobile-fab"
    style="background:#4f46e5;bottom:84px"
    onclick="openActivityModal()"
    title="新增活動">
    +

let cloudProjects = JSON.parse(JSON.stringify(DEFAULT_PROJECTS));
let cloudBills    = {};
let localState    = { currentProjectId:"p1", timelineSelectedDate:"ALL", currentApp:"trip" };

function loadLocalState(){
    try{ const s=localStorage.getItem("unified_local"); if(s) Object.assign(localState,JSON.parse(s)); }catch(e){}
}
function saveLocalState(){ localStorage.setItem("unified_local",JSON.stringify(localState)); }

let _currentApp = "trip";
let _currentTab = "timeline";

function getCurrentProject(){
    const found=cloudProjects.find(p=>p.id===localState.currentProjectId);
    if(!found&&cloudProjects.length>0){ localState.currentProjectId=cloudProjects[0].id; saveLocalState(); return cloudProjects[0]; }

}

// ════════════════════════════════════════════════════════════════

    saveLocalState();

}

    const isTrip = _currentApp==="trip";

// ════════════════════════════════════════════════════════════════
//  FAB 顯示控制
//  - TripPlanner 時程圖 Tab：顯示 fab-add-activity
//  - BillSplitter：顯示 fab-add-bill
//  - 其他情況：全隱藏
//  - 桌面版（≥768px）：全隱藏（由 CSS media query 控制）
// ════════════════════════════════════════════════════════════════
function updateFabVisibility(){
    const fabActivity = document.getElementById("fab-add-activity");
    const fabBill     = document.getElementById("fab-add-bill");
    // 先全隱藏（JS 層），CSS media query 會在桌面版強制 display:none
    fabActivity.style.display = "none";
    fabBill.style.display     = "none";

    if(_currentApp === "trip" && _currentTab === "timeline"){
        // 讓 CSS media query 決定是否顯示（手機才顯示）
        fabActivity.style.display = "";
    } else if(_currentApp === "bill"){
        fabBill.style.display = "";
    }
}

// ════════════════════════════════════════════════════════════════
//  同步狀態 UI
// ════════════════════════════════════════════════════════════════
function setSyncStatus(s){
    const dot=document.getElementById("sync-dot"),text=document.getElementById("sync-text");
    const m={connecting:{cls:"bg-slate-300",label:"連線中..."},synced:{cls:"bg-green-400",label:"已同步"},saving:{cls:"bg-amber-400 animate-pulse",label:"儲存中..."},error:{cls:"bg-red-400",label:"離線模式"}};
    const v=m[s]||m.connecting;
    dot.className=`w-2 h-2 rounded-full flex-shrink-0 ${v.cls}`; text.textContent=v.label;
}

// ════════════════════════════════════════════════════════════════
//  Firebase 資料層
// ════════════════════════════════════════════════════════════════
let _isSaving=false, _unsubscribe=null;
function getTripDocRef(){ return window._fsDoc(window._db,"tripplanner","shared"); }
function getBillDocRef(){ return window._fsDoc(window._db,"tripplanner","bills"); }

async function saveData(){
    if(!window._firebaseReady){
        localStorage.setItem("trip_projects_bk",JSON.stringify(cloudProjects));
        localStorage.setItem("trip_bills_bk",JSON.stringify(cloudBills));
        return;
    }
    try{
        setSyncStatus("saving"); _isSaving=true;
        await Promise.all([
            window._fsSetDoc(getTripDocRef(),{projects:cloudProjects}),
            window._fsSetDoc(getBillDocRef(),{bills:cloudBills})
        ]);
        setSyncStatus("synced");
    }catch(e){
        console.error("Firestore 儲存失敗",e); setSyncStatus("error");
        localStorage.setItem("trip_projects_bk",JSON.stringify(cloudProjects));
        localStorage.setItem("trip_bills_bk",JSON.stringify(cloudBills));
    }finally{ setTimeout(()=>{_isSaving=false;},800); }
}

async function initCloudSync(){
    setSyncStatus("connecting"); loadLocalState();
    _currentApp=localState.currentApp||"trip";
    try{
        const [tripSnap,billSnap]=await Promise.all([window._fsGetDoc(getTripDocRef()),window._fsGetDoc(getBillDocRef())]);
        if(tripSnap.exists()&&tripSnap.data().projects) cloudProjects=tripSnap.data().projects;
        else await window._fsSetDoc(getTripDocRef(),{projects:cloudProjects});
        if(billSnap.exists()&&billSnap.data().bills) cloudBills=billSnap.data().bills;
        else await window._fsSetDoc(getBillDocRef(),{bills:cloudBills});
        getCurrentProject();
        setSyncStatus("synced");
        document.getElementById("loading-overlay").classList.add("hidden");
        renderProjectSelector(); loadProject(); applyAppUI(); lucide.createIcons();

        _unsubscribe=window._fsOnSnapshot(getTripDocRef(),(snap)=>{
            if(_isSaving||!snap.exists()||!snap.data().projects) return;
            const viewingId=localState.currentProjectId;
            cloudProjects=snap.data().projects;
            const still=cloudProjects.find(p=>p.id===viewingId);
            if(!still&&cloudProjects.length>0){ localState.currentProjectId=cloudProjects[0].id; saveLocalState(); showToast("你正在查看的專案已被刪除，已自動切換。"); }
            renderProjectSelector(); refreshCurrentView(); setSyncStatus("synced");
        });
        window._fsOnSnapshot(getBillDocRef(),(snap)=>{
            if(_isSaving||!snap.exists()||!snap.data().bills) return;
            cloudBills=snap.data().bills;
            if(_currentApp==="bill") bsRenderApp();
        });
    }catch(e){
        console.error("Firestore 初始化失敗",e); setSyncStatus("error");
        document.getElementById("loading-overlay").classList.add("hidden");
        try{ const b=localStorage.getItem("trip_projects_bk"); if(b) cloudProjects=JSON.parse(b); }catch(_){}
        try{ const b=localStorage.getItem("trip_bills_bk"); if(b) cloudBills=JSON.parse(b); }catch(_){}
        loadLocalState(); getCurrentProject();
        renderProjectSelector(); loadProject(); applyAppUI(); lucide.createIcons();
    }
}

document.addEventListener("DOMContentLoaded",()=>{
    if(window._firebaseReady){ initCloudSync(); }
    else{
        window.addEventListener("firebase-ready",initCloudSync,{once:true});
        setTimeout(()=>{
            if(!window._firebaseReady){
                setSyncStatus("error");
                document.getElementById("loading-overlay").classList.add("hidden");
                loadLocalState(); _currentApp=localState.currentApp||"trip";
                renderProjectSelector(); loadProject(); applyAppUI(); lucide.createIcons();
            }

    }
});

// ════════════════════════════════════════════════════════════════
//  TripPlanner：時程圖
// ════════════════════════════════════════════════════════════════
function renderTimeline(){
    const project=getCurrentProject(); if(!project) return;
    const filtersContainer=document.getElementById("timeline-date-filters");
    const dates=[]; let curr=new Date(project.startDate); const stop=new Date(project.endDate);
    while(curr<=stop){ dates.push(curr.toISOString().split("T")[0]); curr.setDate(curr.getDate()+1); }

    let filterHtml=`<button onclick="setTimelineDate('ALL')" class="px-2.5 py-1 rounded-full text-xs font-medium transition-colors ${localState.timelineSelectedDate==='ALL'?'bg-indigo-600 text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}">全部(${dates.length}天)</button>`;
    dates.forEach(d=>{ const sel=localState.timelineSelectedDate===d; filterHtml+=`<button onclick="setTimelineDate('${d}')" class="px-2.5 py-1 rounded-full text-xs font-medium transition-colors ${sel?'bg-indigo-600 text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${d.substring(5)}</button>`; });
    filtersContainer.innerHTML=filterHtml;

    const displayDates=localState.timelineSelectedDate==="ALL"?dates:[localState.timelineSelectedDate];
    const filteredActivities=project.activities.filter(a=>displayDates.includes(a.start.split("T")[0]));

    let minHour=8,maxHour=20;
    if(filteredActivities.length>0){
        let earliest=24,latest=0;
        filteredActivities.forEach(a=>{ const sh=new Date(a.start).getHours(); const eh=new Date(a.end).getHours()+(new Date(a.end).getMinutes()>0?1:0); if(sh<earliest)earliest=sh; if(eh>latest)latest=eh; });
        minHour=Math.max(0,Math.min(minHour,earliest)); maxHour=Math.min(24,Math.max(maxHour,latest));
    }

    const gridContainer=document.getElementById("timeline-grid");
    let gridHtml=`<div class="grid" style="grid-template-columns:52px repeat(${displayDates.length},minmax(160px,1fr));">`;
    gridHtml+=`<div class="p-2 bg-slate-50 border-b border-r border-slate-200 text-[10px] font-semibold text-slate-500 text-center sticky left-0 z-10">時間</div>`;
    displayDates.forEach(d=>{ gridHtml+=`<div class="p-2 bg-slate-50 border-b border-r border-slate-200 text-xs font-bold text-slate-700 text-center">${d}</div>`; });
    for(let h=minHour;h<maxHour;h++){
        const hl=`${String(h).padStart(2,'0')}:00`;
        gridHtml+=`<div class="h-14 sm:h-16 p-1 border-b border-r border-slate-100 text-[10px] font-mono text-slate-400 text-center relative bg-slate-50/50 sticky left-0 z-10 flex items-center justify-center">${hl}</div>`;
        displayDates.forEach(d=>{ gridHtml+=`<div class="h-14 sm:h-16 border-b border-r border-slate-100 relative bg-white" id="cell-${d}-${h}"></div>`; });
    }
    gridHtml+=`</div>`; gridContainer.innerHTML=gridHtml;

    const isMobile=window.innerWidth<768; const cellH=isMobile?56:64;

    displayDates.forEach(d=>{
        const dayActs=filteredActivities.filter(a=>a.start.split("T")[0]===d)
            .map(a=>{ const sd=new Date(a.start),ed=new Date(a.end); return{...a,startH:sd.getHours()+sd.getMinutes()/60,endH:ed.getHours()+ed.getMinutes()/60}; })
            .filter(a=>a.endH>minHour&&a.startH<maxHour)
            .sort((a,b)=>a.startH-b.startH||(b.endH-b.startH)-(a.endH-a.startH));
        if(dayActs.length===0) return;

        let clusters=[],cc=[],ce=-1;
        dayActs.forEach(act=>{ if(cc.length===0||act.startH<ce){ cc.push(act); if(act.endH>ce)ce=act.endH; }else{ clusters.push(cc); cc=[act]; ce=act.endH; } });
        if(cc.length>0) clusters.push(cc);

        clusters.forEach(cluster=>{
            let tracks=[];
            cluster.forEach(act=>{ let at=-1; for(let t=0;t<tracks.length;t++){ if(tracks[t]<=act.startH){at=t;tracks[t]=act.endH;break;} } if(at===-1){at=tracks.length;tracks.push(act.endH);} act.trackIndex=at; });
            const tt=tracks.length;
            cluster.forEach(act=>{
                const sci=Math.floor(act.startH); const cell=document.getElementById(`cell-${d}-${sci}`); if(!cell) return;
                const height=Math.max((act.endH-act.startH)*cellH,24);
                const wp=100/tt; const lp=act.trackIndex*wp;
                const block=document.createElement("div");
                block.className=`absolute rounded-md sm:rounded-lg p-1.5 text-white shadow-sm cursor-pointer transition-all hover:scale-[1.02] hover:z-30 hover:shadow-md z-20 overflow-hidden flex flex-col justify-between ${act.isTentative?'bg-tentative border border-white/40':''}`;
                block.style.top=`${(act.startH-sci)*cellH}px`; block.style.height=`${height}px`;
                block.style.left=`calc(${lp}% + 2px)`; block.style.width=`calc(${wp}% - 4px)`;
                block.style.backgroundColor=act.color||"#3b82f6";
                block.onclick=(e)=>{ e.stopPropagation(); openActivityDetailModal(act.id); };
                const partDots=act.participants.map(pid=>{ const p=project.personnel.find(p=>p.id===pid); if(!p) return ''; return `<span class="inline-flex items-center justify-center w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full text-[8px] sm:text-[9px] font-bold text-white ring-1 ring-white/50" style="background-color:${p.color}">${p.name.charAt(0).toUpperCase()}</span>`; }).join("");
                block.innerHTML=`<div><div class="font-bold text-[10px] sm:text-xs truncate leading-tight">${act.name}</div><div class="text-[9px] sm:text-[10px] opacity-90 font-mono">${act.start.substring(11,16)}-${act.end.substring(11,16)}</div></div><div class="flex items-center space-x-0.5 mt-0.5">${partDots}</div>`;
                cell.appendChild(block);
            });
        });
    });
}

            document.getElementById("act-location").value=act.location||""; document.getElementById("act-contact").value=act.contact||"";

function handleSaveActivity(e){
    e.preventDefault(); const project=getCurrentProject(); const id=document.getElementById("act-id").value;
    const sp=Array.from(document.querySelectorAll(".act-part-cb:checked")).map(cb=>cb.value);

function isMemberInBills(personName){
    const project=getCurrentProject(); if(!project) return false;
    return (cloudBills[project.id]||[]).some(b=>b.payer===personName||Object.keys(b.shares||{}).includes(personName));
}

    const color=document.getElementById("person-color-input").value;
    project.personnel.push({id:"u_"+Date.now(),name,color});
    saveData(); closeModal("add-person-modal"); document.getElementById("person-name-input").value=""; loadProject();
}

function updatePersonColor(personId,newColor){
    const project=getCurrentProject(); const person=project.personnel.find(p=>p.id===personId);
    if(person){ person.color=newColor; saveData(); loadProject(); }
}

function deletePerson(personId){
    const project=getCurrentProject();
    if(project.personnel.length<=1){ alert("專案至少需要保留一名成員！"); return; }
    const person=project.personnel.find(p=>p.id===personId);
    if(person&&isMemberInBills(person.name)){ alert("此成員已有分帳單據紀錄，無法刪除。"); return; }
    if(!confirm("確定刪除此成員？（活動列表中的相應參與標籤也會同步更新）")) return;
    project.personnel=project.personnel.filter(p=>p.id!==personId);
    project.activities.forEach(a=>{ a.participants=a.participants.filter(pid=>pid!==personId); });
    saveData(); loadProject();
}

function openModal(id){ document.getElementById(id).classList.remove("hidden"); }
function closeModal(id){ document.getElementById(id).classList.add("hidden"); }

// ════════════════════════════════════════════════════════════════
//  BillSplitter
// ════════════════════════════════════════════════════════════════
let bsCurrentBillMode="equal";
let bsActiveViewBillId=null;

function bsGetBills(){ return cloudBills[localState.currentProjectId]||[]; }
function bsSetBills(bills){ cloudBills[localState.currentProjectId]=bills; }

function bsRenderApp(){
    const project=getCurrentProject();
    document.getElementById("bs-project-title").innerText=project?project.name:"請先建立或選擇專案";
    document.getElementById("bs-project-members").innerHTML=project?memberAvatars(project.personnel,"w-6 h-6 sm:w-7 sm:h-7"):"";
    const billListEl=document.getElementById("bs-bill-list");
    if(!project){ billListEl.innerHTML='<li style="text-align:center;color:#64748b;padding:10px">尚無專案</li>'; bsRenderSettlement([]); return; }
    const bills=bsGetBills();
    if(bills.length===0){
        billListEl.innerHTML='<li style="text-align:center;color:#64748b;padding:10px">尚無單據資料</li>';
    }else{
        billListEl.innerHTML=bills.map(b=>{
            const payerPerson=project.personnel.find(p=>p.name===b.payer);
            const payerAvatar=payerPerson?memberAvatar(payerPerson,"w-5 h-5"):"";
            return `<li class="bs-bill-item" onclick="bsViewBill('${b.id}')">
                <div>
                    <strong>${bsEscapeHtml(b.title)}</strong>
                    <div style="font-size:.8rem;color:#64748b;display:flex;align-items:center;gap:5px;margin-top:3px">
                        付款人：${payerAvatar}<span>${bsEscapeHtml(b.payer)}</span>
                    </div>
                </div>
                <div><strong>${Number(b.amount).toFixed(2)} 元</strong></div>
            </li>`;
        }).join("");
    }
    bsCalculateAndRenderSettlement();
}

function bsOpenBillModal(billToEdit=null){
    const project=getCurrentProject(); if(!project) return alert("請先建立專案");
    const payerSelect=document.getElementById("bs-bill-payer");
    payerSelect.innerHTML=project.personnel.map(m=>`<option value="${bsEscapeHtml(m.name)}">${bsEscapeHtml(m.name)}</option>`).join("");
    if(billToEdit){
        document.getElementById("bs-bill-modal-title").textContent="編輯單據";
        document.getElementById("bs-editing-bill-id").value=billToEdit.id;
        document.getElementById("bs-bill-title").value=billToEdit.title;
        payerSelect.value=billToEdit.payer;
        document.getElementById("bs-btn-delete-bill").style.display="block";
        bsSetBillMode(billToEdit.mode);
        if(billToEdit.mode==="equal"){ document.getElementById("bs-bill-total-amount").value=billToEdit.amount; bsRenderEqualDebtors(billToEdit.debtorDeductions); }
        else bsRenderCustomDebtors(billToEdit.customDebts);
    }else{
        document.getElementById("bs-bill-modal-title").textContent="新增單據";
        document.getElementById("bs-editing-bill-id").value="";
        document.getElementById("bs-bill-title").value="";
        document.getElementById("bs-bill-total-amount").value="";
        document.getElementById("bs-btn-delete-bill").style.display="none";
        bsSetBillMode("equal"); bsRenderEqualDebtors({}); bsRenderCustomDebtors({});
    }
    document.getElementById("bs-bill-modal").classList.add("active");
}

function bsSetBillMode(mode){
    bsCurrentBillMode=mode;
    document.getElementById("bs-btn-mode-equal").classList.toggle("active",mode==="equal");
    document.getElementById("bs-btn-mode-custom").classList.toggle("active",mode==="custom");
    document.getElementById("bs-equal-mode-area").style.display=mode==="equal"?"block":"none";
    document.getElementById("bs-custom-mode-area").style.display=mode==="custom"?"block":"none";
}

function bsToggleSelectAll(checked){
    document.querySelectorAll(".bs-eq-check").forEach(cb=>{ cb.checked=checked; });
}

function bsSyncSelectAllState(){
    const all=document.querySelectorAll(".bs-eq-check");
    const checked=document.querySelectorAll(".bs-eq-check:checked");
    const cb=document.getElementById("bs-select-all-cb"); if(!cb) return;
    cb.indeterminate=checked.length>0&&checked.length<all.length;
    cb.checked=checked.length===all.length&&all.length>0;
}

function bsRenderEqualDebtors(deductions={}){
    const project=getCurrentProject(); if(!project) return;
    const container=document.getElementById("bs-equal-debtors-list");
    container.innerHTML=project.personnel.map(p=>{
        const m=p.name;
        return `<div class="bs-dynamic-row">
            <label style="flex:1;display:flex;align-items:center;gap:6px">
                <input type="checkbox" class="bs-eq-check" value="${bsEscapeHtml(m)}" ${deductions[m]!==undefined?'checked':''} onchange="bsSyncSelectAllState()" style="width:16px;height:16px">
                ${memberAvatar(p,"w-5 h-5")}
                <span>${bsEscapeHtml(m)}</span>
            </label>
            <span>扣除：</span>
            <input type="number" class="bs-form-control bs-eq-deduct" data-member="${bsEscapeHtml(m)}" value="${deductions[m]||0}" style="width:90px"> 元
        </div>`;
    }).join("");
    setTimeout(bsSyncSelectAllState,0);
}

function bsRenderCustomDebtors(customDebts={}){
    const project=getCurrentProject(); if(!project) return;
    const container=document.getElementById("bs-custom-debtors-list");
    container.innerHTML=project.personnel.map(p=>{
        const m=p.name;
        return `<div class="bs-dynamic-row">
            <span style="flex:1;display:flex;align-items:center;gap:6px">${memberAvatar(p,"w-5 h-5")}${bsEscapeHtml(m)}</span>
            <input type="number" class="bs-form-control bs-custom-debt" data-member="${bsEscapeHtml(m)}" value="${customDebts[m]||0}" style="width:110px"> 元
        </div>`;
    }).join("");
}

function bsSaveBill(){
    const title=document.getElementById("bs-bill-title").value.trim();
    const payer=document.getElementById("bs-bill-payer").value;
    const editingId=document.getElementById("bs-editing-bill-id").value;
    if(!title) return alert("請輸入單據名稱");
    let billData={id:editingId||"bill_"+Date.now(),title,payer,mode:bsCurrentBillMode,shares:{}};
    if(bsCurrentBillMode==="equal"){
        const total=parseFloat(document.getElementById("bs-bill-total-amount").value);
        if(isNaN(total)||total<=0) return alert("請輸入有效總金額");
        const checkboxes=document.querySelectorAll(".bs-eq-check:checked");
        const selectedMembers=Array.from(checkboxes).map(c=>c.value);
        if(selectedMembers.length===0) return alert("請至少選擇一位欠款人");
        let deductions={},sumDeduction=0;
        document.querySelectorAll(".bs-eq-deduct").forEach(input=>{ const m=input.dataset.member; if(selectedMembers.includes(m)){ const val=parseFloat(input.value)||0; deductions[m]=val; sumDeduction+=val; } });
        if(sumDeduction>total) return alert("扣除額總和不可大於總金額");
        const totalCents=bsToCents(total); const deductionCents={}; let sumDC=0;
        selectedMembers.forEach(m=>{ deductionCents[m]=bsToCents(deductions[m]||0); sumDC+=deductionCents[m]; });
        if(sumDC>totalCents) return alert("扣除額總和不可大於總金額");
        const remainCents=totalCents-sumDC; const baseShare=Math.floor(remainCents/selectedMembers.length); let remainder=remainCents%selectedMembers.length;
        selectedMembers.forEach(m=>{ const extra=remainder>0?1:0; if(remainder>0)remainder--; billData.shares[m]=bsCentsToAmount(deductionCents[m]+baseShare+extra); });
        billData.amount=bsCentsToAmount(totalCents); billData.debtorDeductions=deductions;
    }else{
        let total=0,debts={};
        document.querySelectorAll(".bs-custom-debt").forEach(input=>{ const m=input.dataset.member; const val=parseFloat(input.value)||0; if(val>0){debts[m]=val;total+=val;} });
        if(total<=0) return alert("債務總額必須大於 0");
        billData.amount=total; billData.shares=debts; billData.customDebts=debts;
    }
    const bills=bsGetBills();
    if(editingId){ const idx=bills.findIndex(b=>b.id===editingId); bills[idx]=billData; }
    else bills.push(billData);
    bsSetBills(bills); saveData();
    bsCloseModal("bs-bill-modal"); bsCloseModal("bs-view-bill-modal"); bsRenderApp();
}

function bsViewBill(id){
    bsActiveViewBillId=id;
    const project=getCurrentProject();
    const bill=bsGetBills().find(b=>b.id===id); if(!bill) return;
    document.getElementById("bs-view-bill-title").textContent=bill.title;
    const payerPerson=project?project.personnel.find(p=>p.name===bill.payer):null;
    const payerAvatar=payerPerson?memberAvatar(payerPerson,"w-5 h-5"):"";
    let html=`
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><strong>付款人：</strong>${payerAvatar}<span>${bsEscapeHtml(bill.payer)}</span></div>
        <div><strong>總金額：</strong>${Number(bill.amount).toFixed(2)} 元</div>
        <div><strong>分攤模式：</strong>${bill.mode==="equal"?"均分模式":"指定模式"}</div>
        <hr style="margin:8px 0;border:none;border-top:1px solid #e2e8f0">
        <div><strong>各人應負擔明細：</strong></div>`;
    for(let [member,amt] of Object.entries(bill.shares)){
        const mp=project?project.personnel.find(p=>p.name===member):null;
        const av=mp?memberAvatar(mp,"w-4 h-4"):"";
        html+=`<div style="display:flex;align-items:center;gap:5px;margin-top:4px">- ${av}<span>${bsEscapeHtml(member)}: ${Number(amt).toFixed(2)} 元</span></div>`;
    }
    document.getElementById("bs-view-bill-content").innerHTML=html;
    document.getElementById("bs-view-bill-modal").classList.add("active");
}

function bsOpenEditBillModal(){
    const bill=bsGetBills().find(b=>b.id===bsActiveViewBillId);
    bsCloseModal("bs-view-bill-modal"); bsOpenBillModal(bill);
}

function bsDeleteCurrentBill(){
    if(!confirm("確定要刪除這筆單據嗎？")) return;
    const editingId=document.getElementById("bs-editing-bill-id").value;
    const bills=bsGetBills().filter(b=>b.id!==bsActiveViewBillId&&b.id!==editingId);
    bsSetBills(bills); saveData();
    bsCloseModal("bs-view-bill-modal"); bsCloseModal("bs-bill-modal"); bsRenderApp();
}

function bsCloseModal(id){ document.getElementById(id).classList.remove("active"); }

function bsCalculateAndRenderSettlement(){
    const project=getCurrentProject(); const bills=bsGetBills();
    if(!project||bills.length===0){ bsRenderSettlement([]); return; }
    const balances={}; project.personnel.forEach(p=>balances[p.name]=0);
    bills.forEach(bill=>{
        const payer=bill.payer; const ba=bsToCents(bill.amount);
        if(balances[payer]===undefined) balances[payer]=0; balances[payer]+=ba;
        for(const [debtor,amt] of Object.entries(bill.shares||{})){
            if(balances[debtor]===undefined) balances[debtor]=0; balances[debtor]-=bsToCents(amt);
        }
    });
    const totalBalance=Object.values(balances).reduce((s,v)=>s+v,0);
    if(totalBalance!==0){ bsRenderSettlement([]); return; }
    bsRenderSettlement(bsSolveMinimumTransactions(balances));
}

function bsToCents(amount){ const v=Number(amount); if(!Number.isFinite(v)) return 0; return Math.round(v*100); }
function bsCentsToAmount(cents){ return cents/100; }

function bsSolveMinimumTransactions(balances){
    const entries=Object.entries(balances).map(([member,cents])=>({member,cents})).filter(x=>x.cents!==0);
    if(entries.length<=1) return [];
    const best={count:Infinity,transactions:[]};
    const working=entries.map(x=>x.cents); const names=entries.map(x=>x.member);
    function dfs(start,transactions){
        while(start<working.length&&working[start]===0) start++;
        if(start===working.length){ if(transactions.length<best.count){best.count=transactions.length;best.transactions=transactions.map(t=>({...t}));} return; }
        if(transactions.length>=best.count) return;
        const seen=new Set(); const candidates=[];
        for(let j=start+1;j<working.length;j++){
            if(working[j]===0) continue;
            if((working[start]<0&&working[j]>0)||(working[start]>0&&working[j]<0)){
                const key=String(working[j]); if(!seen.has(key)){seen.add(key);candidates.push(j);}
            }
        }
        candidates.sort((a,b)=>{ const ae=Math.abs(working[start]+working[a])===0?0:1; const be=Math.abs(working[start]+working[b])===0?0:1; if(ae!==be)return ae-be; return Math.abs(working[start]+working[a])-Math.abs(working[start]+working[b]); });
        for(const j of candidates){
            const amount=Math.min(Math.abs(working[start]),Math.abs(working[j])); if(amount<=0) continue;
            const from=working[start]<0?names[start]:names[j]; const to=working[start]<0?names[j]:names[start];
            const os=working[start]; const oj=working[j];
            working[start]=os<0?os+amount:os-amount; working[j]=oj<0?oj+amount:oj-amount;
            transactions.push({from,to,amount:bsCentsToAmount(amount)});
            const ns=working[start]===0?start+1:start; dfs(ns,transactions);
            transactions.pop(); working[start]=os; working[j]=oj;
            if(Math.abs(working[start])===0) break;
        }
    }
    dfs(0,[]); return best.transactions;
}

function bsRenderSettlement(transactions){
    const container=document.getElementById("bs-settlement-list");
    if(transactions.length===0){ container.innerHTML='<div style="text-align:center;color:#64748b">帳務已平衡，無需額外交易！</div>'; return; }
    const project=getCurrentProject();
    container.innerHTML=transactions.map(t=>{
        const fp=project?project.personnel.find(p=>p.name===t.from):null;
        const tp=project?project.personnel.find(p=>p.name===t.to):null;
        const fa=fp?memberAvatar(fp,"w-5 h-5"):""; const ta=tp?memberAvatar(tp,"w-5 h-5"):"";
        return `<div class="bs-settlement-item">
            <span style="display:flex;align-items:center;gap:5px">${fa}<strong>${bsEscapeHtml(t.from)}</strong><span style="margin:0 4px">應給予</span>${ta}<strong>${bsEscapeHtml(t.to)}</strong></span>
            <strong style="color:var(--bs-primary)">${Number(t.amount).toFixed(2)} 元</strong>
        </div>`;
    }).join("");
}

function bsEscapeHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }

document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'){
        ['bs-bill-modal','bs-view-bill-modal'].forEach(bsCloseModal);
        ['new-project-modal','activity-modal','activity-detail-modal','add-person-modal'].forEach(closeModal);
    }
});
